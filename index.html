<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇 - Snake Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            padding: 20px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        .score-display {
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88;
        }

        .high-score {
            color: #ffd700;
            font-size: 12px;
            text-shadow: 0 0 10px #ffd700;
        }

        .canvas-wrapper {
            position: relative;
            border: 3px solid #00ff88;
            border-radius: 8px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
        }

        canvas {
            display: block;
            background: #0d0d12;
            border-radius: 5px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.9);
            border-radius: 5px;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            color: #00ff88;
            font-size: 24px;
            text-shadow: 0 0 20px #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .overlay h2 {
            color: #ff4757;
            font-size: 20px;
            text-shadow: 0 0 15px #ff4757;
        }

        .overlay p {
            color: #888;
            font-size: 10px;
            line-height: 2;
        }

        .overlay .final-score {
            color: #fff;
            font-size: 16px;
        }

        .controls-hint {
            color: #555;
            font-size: 8px;
            margin-top: 10px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 520px) {
            .score-display, .high-score {
                font-size: 10px;
            }
            .overlay h1 {
                font-size: 18px;
            }
            .overlay p, .controls-hint {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-display">得分: <span id="score">0</span></div>
            <div class="high-score">最高: <span id="highScore">0</span></div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <div class="overlay" id="startOverlay">
                <h1>贪吃蛇</h1>
                <p>使用方向键或WASD控制蛇<br>吃到食物得分</p>
                <p class="controls-hint">按空格键或点击开始</p>
            </div>
            
            <div class="overlay hidden" id="pauseOverlay">
                <h1>暂停</h1>
                <p class="controls-hint">按P继续</p>
            </div>
            
            <div class="overlay hidden" id="gameOverOverlay">
                <h2>游戏结束</h2>
                <p class="final-score">得分: <span id="finalScore">0</span></p>
                <p class="controls-hint">按空格键重新开始</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20;
        let CELL_SIZE;
        let CANVAS_SIZE;
        
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameState = 'START';
        let gameLoop = null;
        let gameSpeed = 150;
        
        highScoreEl.textContent = highScore;
        
        function resizeCanvas() {
            const maxSize = Math.min(window.innerWidth - 40, window.innerHeight - 150, 500);
            CANVAS_SIZE = Math.max(300, maxSize);
            CELL_SIZE = Math.floor(CANVAS_SIZE / GRID_SIZE);
            CANVAS_SIZE = CELL_SIZE * GRID_SIZE;
            
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;
            
            if (gameState !== 'START') {
                draw();
            }
        }
        
        function initGame() {
            snake = [
                { x: Math.floor(GRID_SIZE / 2), y: Math.floor(GRID_SIZE / 2) },
                { x: Math.floor(GRID_SIZE / 2) - 1, y: Math.floor(GRID_SIZE / 2) },
                { x: Math.floor(GRID_SIZE / 2) - 2, y: Math.floor(GRID_SIZE / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }
        
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                validPosition = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }
        
        function update() {
            direction = { ...nextDirection };
            
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };
            
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }
            
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
                
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                if (gameSpeed > 80) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(() => {
                        if (gameState === 'PLAYING') {
                            update();
                            draw();
                        }
                    }, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }
        
        function draw() {
            ctx.fillStyle = '#0d0d12';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }
            
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * CELL_SIZE + CELL_SIZE / 2,
                    segment.y * CELL_SIZE + CELL_SIZE / 2,
                    0,
                    segment.x * CELL_SIZE + CELL_SIZE / 2,
                    segment.y * CELL_SIZE + CELL_SIZE / 2,
                    CELL_SIZE / 2
                );
                
                if (index === 0) {
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00cc6a');
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(0, 204, 106, ${alpha})`);
                    gradient.addColorStop(1, `rgba(0, 153, 80, ${alpha})`);
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * CELL_SIZE + 2,
                    segment.y * CELL_SIZE + 2,
                    CELL_SIZE - 4,
                    CELL_SIZE - 4,
                    4
                );
                ctx.fill();
            });
            
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2 - 3,
                food.y * CELL_SIZE + CELL_SIZE / 2 - 3,
                2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        function startGame() {
            initGame();
            gameState = 'PLAYING';
            gameSpeed = 150;
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                if (gameState === 'PLAYING') {
                    update();
                    draw();
                }
            }, gameSpeed);
            
            draw();
        }
        
        function pauseGame() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.classList.remove('hidden');
                clearInterval(gameLoop);
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.classList.add('hidden');
                gameLoop = setInterval(() => {
                    if (gameState === 'PLAYING') {
                        update();
                        draw();
                    }
                }, gameSpeed);
            }
        }
        
        function gameOver() {
            gameState = 'GAMEOVER';
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }
        
        function handleKeydown(e) {
            const key = e.key.toLowerCase();
            
            if ([' ', 'enter'].includes(key) || (gameState === 'START' && key === '')) {
                e.preventDefault();
                if (gameState === 'START' || gameState === 'GAMEOVER') {
                    startGame();
                }
                return;
            }
            
            if (key === 'p' && (gameState === 'PLAYING' || gameState === 'PAUSED')) {
                pauseGame();
                return;
            }
            
            if (gameState !== 'PLAYING') return;
            
            switch (key) {
                case 'arrowup':
                case 'w':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
            }
        }
        
        let touchStartX = 0;
        let touchStartY = 0;
        
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
        
        function handleTouchEnd(e) {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame();
                return;
            }
            
            if (gameState !== 'PLAYING') return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && direction.x !== -1) {
                    nextDirection = { x: 1, y: 0 };
                } else if (dx < -30 && direction.x !== 1) {
                    nextDirection = { x: -1, y: 0 };
                }
            } else {
                if (dy > 30 && direction.y !== -1) {
                    nextDirection = { x: 0, y: 1 };
                } else if (dy < -30 && direction.y !== 1) {
                    nextDirection = { x: 0, y: -1 };
                }
            }
        }
        
        document.addEventListener('keydown', handleKeydown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
        window.addEventListener('resize', resizeCanvas);
        
        resizeCanvas();
        draw();
    </script>
</body>
</html>
